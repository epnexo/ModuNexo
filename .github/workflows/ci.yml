name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned: ubuntu-latest moved to a release whose repositories no longer carry the PostgreSQL 16 client tools.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: epnexo
          POSTGRES_PASSWORD: epnexo
          POSTGRES_DB: epnexo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epnexo -d epnexo_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://epnexo:epnexo@127.0.0.1:5432/epnexo_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # backup.sh and restore.sh use the PostgreSQL client tools on the PATH. The runner ships a newer client than the
      # postgres:16 service, and a newer pg_dump writes settings (transaction_timeout) that a 16 server rejects on restore.
      - name: Use the PostgreSQL 16 client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: pg_dump --version
      - run: npm ci
      # Known vulnerabilities in what ships to production fail the build; dev-only tooling is not counted.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
