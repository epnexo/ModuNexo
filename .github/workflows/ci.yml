name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: epnexo
          POSTGRES_PASSWORD: epnexo
          POSTGRES_DB: epnexo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epnexo -d epnexo_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://epnexo:epnexo@127.0.0.1:5432/epnexo_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known vulnerabilities in what ships to production fail the build; dev-only tooling is not counted.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
