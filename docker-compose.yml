# Explicit project name: this stack never shares a compose project with other databases on the machine.
name: epnexo-shell-core

services:
  db:
    image: postgres:16-alpine
    container_name: epnexo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: epnexo
      POSTGRES_PASSWORD: epnexo
      POSTGRES_DB: epnexo
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - epnexo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epnexo -d epnexo"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The web app. Not started by a plain `docker compose up -d db` (the development flow): ask for it with
  #   MODUNEXO_MASTER_KEY=... docker compose --profile app up -d --build
  web:
    profiles: ["app"]
    build:
      context: .
      args:
        WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-}
    image: modunexo-app
    container_name: modunexo-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://epnexo:epnexo@db:5432/epnexo
      # Empty when unset: the app then refuses to start naming the variable. A required-variable check here would
      # break every compose command (the database-only development flow included), even for a stopped profile.
      # The old name is passed through too, so an existing .env that only sets EPNEXO_MASTER_KEY keeps working.
      MODUNEXO_MASTER_KEY: ${MODUNEXO_MASTER_KEY:-}
      EPNEXO_MASTER_KEY: ${EPNEXO_MASTER_KEY:-}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - epnexo-modules:/app/modules
      - epnexo-data:/app/var

  # The background-job worker: the same image and volumes as the web app, a different command. It sees the modules the
  # web app installed, so restart it after installing or upgrading a module (`docker compose restart worker`): it
  # loads each job's code once.
  worker:
    profiles: ["app"]
    image: modunexo-app
    container_name: modunexo-worker
    restart: unless-stopped
    command: ["npm", "run", "modunexo", "--", "worker"]
    # The web service applies the migrations on start, so wait for it. The image's health check probes the web port,
    # which a worker does not open.
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://epnexo:epnexo@db:5432/epnexo
      MODUNEXO_MASTER_KEY: ${MODUNEXO_MASTER_KEY:-}
      EPNEXO_MASTER_KEY: ${EPNEXO_MASTER_KEY:-}
    volumes:
      - epnexo-modules:/app/modules
      - epnexo-data:/app/var

volumes:
  epnexo-db-data:
  epnexo-modules:
  epnexo-data:
