services:
  db:
    image: postgres:16-alpine
    container_name: epnexo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: epnexo
      POSTGRES_PASSWORD: epnexo
      POSTGRES_DB: epnexo
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - epnexo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epnexo -d epnexo"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  epnexo-db-data:
